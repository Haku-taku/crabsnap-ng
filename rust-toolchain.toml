# The toolchain every build is expected to use; a system cargo without rustup ignores it.
#
# Nightly by date, for Cargo's `-Zembed-metadata=no` default: an `.rlib` no longer carries a
# second copy of the metadata pipelined compilation already wrote to a `.rmeta`. Measured on
# this workspace, the build directory shrank by 16% in `dev` and 34% in `release`.
[toolchain]
channel = "nightly-2026-11-17"
