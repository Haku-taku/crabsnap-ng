[package]
name = "crabsnap-platform-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The daemon channel on Windows: a message-mode named pipe in the user's session."

[lib]
path = "src/platform.rs"

[dependencies]
crabsnap-core = { path = "../../crabsnap-core" }

# The crate is empty off Windows, so these are declarations only a Windows build compiles.
[target.'cfg(windows)'.dependencies]
ui-core = { path = "../../../ui/crates/ui-core" }
ui-platform-win32 = { path = "../../../ui/crates/ui-platform-win32" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
