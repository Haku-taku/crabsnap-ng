[package]
name = "crabsnap-platform-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The daemon channel on Windows: a message-mode named pipe in the user's session."

[lib]
path = "src/channel.rs"

[dependencies]
crabsnap-core = { path = "../../crabsnap-core" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
