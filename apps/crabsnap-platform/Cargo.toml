[package]
name = "crabsnap-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-bound half of the screenshot app: the local channel to the daemon."

[lib]
path = "src/crabsnap_platform.rs"

[dependencies]
# The ffmpeg shim is the same C on every target: its loader has one branch per platform
# inside, so the app names it once instead of through a target table.
crabsnap-platform-ffmpeg = { path = "ffmpeg" }

# One channel per target, never both: the Unix one binds a socket path, the Windows one a
# named pipe, and neither compiles on the other's platform. This is where the app's choice is
# made, so that its own source makes none.
[target.'cfg(unix)'.dependencies]
crabsnap-platform-unix = { path = "unix" }

[target.'cfg(windows)'.dependencies]
crabsnap-platform-win32 = { path = "win32" }
