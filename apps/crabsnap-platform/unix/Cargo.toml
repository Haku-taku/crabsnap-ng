[package]
name = "crabsnap-platform-unix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The daemon channel on a Unix session: a sequence-packet socket in the runtime directory."

[lib]
path = "src/platform.rs"

# The crate is empty off unix, so these are declarations only a Unix build compiles.
[target.'cfg(unix)'.dependencies]
crabsnap-core = { path = "../../crabsnap-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rustix = { version = "1", features = ["event", "net"] }
ui-core = { path = "../../../ui/crates/ui-core" }
ui-platform = { path = "../../../ui/crates/ui-platform" }
ui-platform-wayland = { path = "../../../ui/crates/ui-platform-wayland" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
