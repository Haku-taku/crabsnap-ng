# The application workspace: it depends on `ui/` by path, and `ui/` never depends on it.
[workspace]
resolver = "3"
members = [
    "crabsnap",
    "crabsnap-core",
    "crabsnap-platform",
    "crabsnap-platform/unix",
    "crabsnap-platform/win32",
    "crabsnap-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

