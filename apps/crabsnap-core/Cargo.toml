[package]
name = "crabsnap-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable half of the screenshot app: the daemon protocol and the paths it uses."

[lib]
path = "src/crabsnap_core.rs"

[dependencies]
bincode = "1.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ui-core = { path = "../../ui/crates/ui-core" }
